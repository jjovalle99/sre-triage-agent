[project]
name = "backend"
version = "0.1.0"
description = "SRE Incident Triage Agent backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.92.0",
    "arize-phoenix-otel>=0.15.0",
    "claude-agent-sdk>=0.1.56",
    "fastapi>=0.135.3",
    "greenlet>=3.3.2",
    "mistralai>=2.3.1",
    "openinference-instrumentation-anthropic>=1.0.0",
    "openinference-instrumentation-claude-agent-sdk>=0.1.0",
    "openinference-instrumentation-mistralai>=2.0.0",
    "openinference-semantic-conventions>=0.1.28",
    "python-multipart>=0.0.24",
    "resend>=2.27.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.38",
    "stamina>=25.2.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.39.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.terminal]
error-on-warning = true
